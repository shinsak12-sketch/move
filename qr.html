<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>거주지 · 발령 희망 조사 QR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F4F6F9;color:#111827;font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
.page{max-width:560px;margin:0 auto;padding:40px 20px 48px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.tag{font-size:13px;font-weight:800;color:#2B55D9;background:#EEF2FE;border-radius:999px;padding:6px 14px}
h1{margin:0;font-size:30px;line-height:1.3;font-weight:800;letter-spacing:-.6px}
.sub{margin:0;font-size:15px;line-height:1.6;color:#4B5563}
.qr{background:#FFFFFF;border:1px solid #E5E7EB;border-radius:24px;padding:28px;width:min(340px,100%)}
.qr svg{display:block;width:100%;height:auto}
.url{font-family:Consolas,'D2Coding',monospace;font-size:15px;font-weight:700;color:#2B55D9;word-break:break-all}
.steps{width:100%;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:18px;padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.55}
.no{flex:0 0 26px;height:26px;border-radius:8px;background:#2B55D9;color:#FFFFFF;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.note{font-size:12.5px;line-height:1.7;color:#4B5563}
.note b{color:#111827}
.print{font:inherit;cursor:pointer;border:1px solid #D7DCE4;background:#FFFFFF;border-radius:12px;height:44px;padding:0 20px;font-size:14px;font-weight:700;color:#111827}
.print:hover{background:#F3F5F8}
@media print{html,body{background:#FFFFFF}.print{display:none}.page{padding-top:24px}.qr,.steps{border-color:#D7DCE4}}
</style>
</head>
<body>
<main class="page">
  <span class="tag">휴대폰으로 참여</span>
  <h1>거주지 · 발령 희망 조사</h1>
  <p class="sub">휴대폰 카메라로 QR 코드를 비추면 조사 화면이 열림</p>
  <div class="qr" role="img" aria-label="조사 사이트 QR 코드"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges"><path fill="#FFFFFF" d="M0 0h29v29H0z"/><path stroke="#111827" d="M0 0.5h7m2 0h1m5 0h2m1 0h3m1 0h7M0 1.5h1m5 0h1m2 0h2m1 0h1m5 0h1m1 0h1m1 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h1m1 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m1 0h3m1 0h1m4 0h3m2 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h3m1 0h4m1 0h4m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m1 0h4m1 0h5m2 0h1m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M8 7.5h2m2 0h2m2 0h1m1 0h3M0 8.5h1m1 0h5m2 0h1m1 0h2m1 0h1m2 0h1m4 0h5M0 9.5h2m2 0h2m1 0h3m9 0h4m1 0h1m3 0h1M1 10.5h4m1 0h2m1 0h1m5 0h1m1 0h1m2 0h1m1 0h3M0 11.5h2m5 0h1m1 0h4m1 0h2m2 0h1m4 0h3m1 0h1M0 12.5h1m1 0h1m3 0h1m2 0h1m1 0h1m3 0h3m1 0h1m5 0h2M1 13.5h1m5 0h5m1 0h2m1 0h1m1 0h7m3 0h1M1 14.5h1m3 0h3m1 0h2m1 0h4m4 0h1m1 0h1m2 0h2M4 15.5h1m5 0h2m1 0h1m1 0h1m3 0h1m1 0h4m2 0h1M0 16.5h3m3 0h3m1 0h1m1 0h1m1 0h4m2 0h1m2 0h1m1 0h2M0 17.5h3m1 0h1m2 0h3m1 0h2m3 0h1m2 0h6m1 0h1m1 0h1M0 18.5h1m1 0h1m1 0h3m2 0h1m2 0h1m2 0h4m1 0h4m2 0h1M0 19.5h1m1 0h4m1 0h1m3 0h2m1 0h2m2 0h1m1 0h1m2 0h1m3 0h1M0 20.5h1m1 0h7m3 0h1m2 0h1m1 0h1m1 0h6m1 0h3M8 21.5h2m3 0h2m1 0h1m1 0h1m1 0h1m3 0h5M0 22.5h7m2 0h1m1 0h5m1 0h4m1 0h1m1 0h3M0 23.5h1m5 0h1m1 0h1m3 0h2m2 0h1m3 0h1m3 0h1m3 0h1M0 24.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1m2 0h5m1 0h2M0 25.5h1m1 0h3m1 0h1m1 0h2m2 0h2m4 0h2m5 0h4M0 26.5h1m1 0h3m1 0h1m1 0h2m2 0h4m3 0h1m1 0h7M0 27.5h1m5 0h1m3 0h1m1 0h2m1 0h2m3 0h1m1 0h4m1 0h1M0 28.5h7m1 0h3m3 0h1m2 0h1m1 0h1m1 0h3m2 0h1"/></svg>
</div>
  <div class="url">move-nine-sigma.vercel.app</div>
  <div class="steps">
    <div class="step"><span class="no">1</span><span><b>성명</b>과 <b>생년월일 6자리</b>로 본인 확인 (예: 900101)</span></div>
    <div class="step"><span class="no">2</span><span>개인정보 동의 후 <b>비밀번호</b> 만들기</span></div>
    <div class="step"><span class="no">3</span><span>현 거주지 주소 검색 → <b>거리 산출</b> (상세주소는 받지 않음)</span></div>
    <div class="step"><span class="no">4</span><span><b>희망 지망</b> 선택 후 최종 제출</span></div>
  </div>
  <p class="note">제출 후에는 수정할 수 없음 · 거리 산출은 재산출 포함 2번까지<br>문의: <b>손사지원파트 신이삭 수석</b></p>
  <button class="print" type="button" onclick="window.print()">인쇄하기</button>
</main>
</body>
</html>
